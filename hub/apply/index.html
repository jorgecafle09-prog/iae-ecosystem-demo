<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmprendeIAE · Application</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form"><header class="top" style="padding:0;border-radius:12px;margin-bottom:20px"><img class="logo" src="/emprende-iae-logo.png"><a class="link" href="/">Ecosystem Hub →</a></header><div id="wrap"><h1>Connect with EmprendeIAE</h1><div class="accent"></div><p class="muted">Apply to NAVES or connect with another EmprendeIAE program.</p><form id="f" class="card formgrid"><label class="field"><b>Program</b><select id="program"><option>NAVES</option><option>WISE</option><option>Open Innovation</option><option>IAE Hackathon</option><option>Community</option></select></label><label class="field"><b>Name</b><input id="name" required></label><label class="field"><b>Email</b><input id="email" type="email" required></label><label class="field"><b>Venture / company</b><input id="venture" required></label><label class="field"><b>Industry</b><select id="industry"><option>Agribusiness</option><option>Knowledge economy</option><option>Renewable energy</option><option>Health</option><option>Tourism</option><option>Software, data & AI</option><option>Cleantech & energy</option><option>Fintech</option></select></label><label class="field"><b>Stage</b><select id="stage"><option>Just an idea</option><option>Prototype / MVP</option><option>Early revenue</option><option>Scaling</option></select></label><label class="field"><b>City</b><input id="city"></label><label class="field"><b>Province</b><input id="province"></label><label class="field span2"><b>What are you building?</b><textarea id="describe"></textarea></label><label class="field span2"><b>What are you looking for?</b><textarea id="looking"></textarea></label><label class="check span2"><input id="directory" type="checkbox"><span>Publish my profile in the Entrepreneur Directory.</span></label><button class="submit span2">Submit application</button></form></div><div id="done" class="card success" hidden></div></main><script src="/data.js"></script><script>const KEY='eiae-ecosystem-state-v3',$=x=>document.getElementById(x),base=()=>({people:JSON.parse(JSON.stringify(window.EIAE_SEED)),subs:[],fav:[],view:'entrepreneur',page:'Entrepreneurs',q:'',sel:null,wh:null,pending:[],importMsg:''});function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}$('f').onsubmit=ev=>{ev.preventDefault();let s=get()||base(),email=$('email').value.trim().toLowerCase(),p=s.people.find(x=>(x.email||'').toLowerCase()===email),year=new Date().getFullYear(),nav=$('program').value==='NAVES';if(!p){let n=Math.max(0,...s.people.map(x=>+(x.personId||'').split('-')[1]).filter(Number.isFinite))+1;p={personId:'EIAE-'+String(n).padStart(6,'0'),name:$('name').value,email,venture:$('venture').value,industry:$('industry').value,stage:$('stage').value,province:$('province').value||'Not specified',location:$('city').value||$('province').value||'Not specified',programs:[$('program').value],status:'Looking to connect',skills:[$('industry').value],needs:[$('looking').value].filter(Boolean),directory:$('directory').checked,shareContact:false,source:'Website',lastUpdated:new Date().toISOString().slice(0,10),sensitive:{},raw:{Program:$('program').value,Name:$('name').value,Email:email,Venture:$('venture').value,Industry:$('industry').value,Stage:$('stage').value,City:$('city').value,Province:$('province').value,Description:$('describe').value,'Looking for':$('looking').value}};s.people.push(p)}let pre=nav?'APP':'REQ',n=s.subs.filter(x=>x.submissionId.startsWith(pre+'-'+year)).length+1,id=pre+'-'+year+'-'+String(n).padStart(5,'0');s.subs.unshift({submissionId:id,personId:p.personId,program:$('program').value,name:p.name,venture:p.venture,email,status:nav?'Received':'New',createdAt:new Date().toISOString(),payload:p.raw});localStorage.setItem(KEY,JSON.stringify(s));$('wrap').hidden=true;$('done').hidden=false;$('done').innerHTML='<h1>Application received</h1><p>Your entrepreneur ID is <b>'+p.personId+'</b>.</p><p>Your submission ID is <b>'+id+'</b>.</p><a class="submit" style="display:inline-block;text-decoration:none" href="/">Open Ecosystem Hub</a>'}</script></body></html>
