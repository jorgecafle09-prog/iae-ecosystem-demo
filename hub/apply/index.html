<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1E22AA"><title>EmprendeIAE · Apply</title><link rel="stylesheet" href="/ui-kit.css"><style>body{margin:0}.apply{max-width:900px;margin:auto;padding:26px}.logo{width:125px;max-height:80px;object-fit:contain}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.success{padding:28px}.hp{position:absolute;left:-9999px}@media(max-width:650px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body class="ei-root"><main class="apply"><div class="head"><img src="/emprende-iae-logo.png" class="logo" alt="Emprende IAE Universidad Austral"><a class="ei-link" href="/">Ecosystem Hub →</a></div><div id="formWrap"><span class="ei-eyebrow">Founders website</span><h1 class="ei-h-display">Connect with EmprendeIAE</h1><p class="ei-muted">Apply to NAVES or contact another EmprendeIAE program. Your submission becomes part of the ecosystem record after validation.</p><form id="f" class="ei-card"><div class="formgrid"><label class="ei-field"><span class="ei-label">Program</span><select id="program" class="ei-select"><option>NAVES</option><option>WISE</option><option>Open Innovation</option><option>IAE Hackathon</option><option>Community</option></select></label><label class="ei-field"><span class="ei-label">Form type</span><select id="type" class="ei-select"><option value="naves_application">NAVES application</option><option value="contact">Contact request</option></select></label><label class="ei-field"><span class="ei-label">Name</span><input id="name" class="ei-input" required></label><label class="ei-field"><span class="ei-label">Email</span><input id="email" type="email" class="ei-input" required></label><label class="ei-field"><span class="ei-label">Venture / company</span><input id="venture" class="ei-input" required></label><label class="ei-field"><span class="ei-label">Industry</span><select id="industry" class="ei-select"><option>Agribusiness</option><option>Knowledge economy</option><option>Renewable energy</option><option>Wine industry</option><option>Mining</option><option>Oil & Gas</option><option>Health</option><option>Tourism</option><option>Agtech & food tech</option><option>Biotech & life sciences</option><option>Health tech & medical devices</option><option>Cleantech & energy</option><option>Software, data & AI</option><option>Hardware, robotics & IoT</option><option>Advanced materials & chemistry</option><option>Fintech</option><option>Edtech</option></select></label><label class="ei-field"><span class="ei-label">Stage</span><select id="stage" class="ei-select"><option>Just an idea</option><option>Prototype / MVP</option><option>Early revenue</option><option>Scaling</option></select></label><label class="ei-field"><span class="ei-label">Need</span><select id="need" class="ei-select"><option value="">Select</option><option>A mentor</option><option>Funding</option><option>A co-founder</option><option>Customers</option></select></label><label class="ei-field"><span class="ei-label">City</span><input id="city" class="ei-input"></label><label class="ei-field"><span class="ei-label">Province</span><input id="province" class="ei-input"></label><label class="ei-field wide"><span class="ei-label">Website <span class="ei-opt">optional</span></span><input id="website" class="ei-input" type="url"></label><label class="ei-field wide"><span class="ei-label">Describe the entrepreneurial venture</span><textarea id="describe" class="ei-textarea"></textarea></label><label class="ei-field wide"><span class="ei-label">What are you looking for?</span><textarea id="looking" class="ei-textarea"></textarea></label><label class="ei-field wide"><span class="ei-label">Problem you are solving</span><textarea id="problem" class="ei-textarea"></textarea></label><label class="ei-field wide"><span class="ei-label">Goals for the program</span><textarea id="goals" class="ei-textarea"></textarea></label><label class="ei-check wide" id="reviewRow"><input id="reviewConsent" type="checkbox"><span>I consent to EmprendeIAE reviewing this NAVES application. <b>Required for NAVES.</b></span></label><label class="ei-check wide"><input id="directoryConsent" type="checkbox"><span>I would like my entrepreneur profile to appear in the ecosystem directory.</span></label><label class="ei-check wide"><input id="shareContact" type="checkbox"><span>I also consent to display my email in the entrepreneur directory.</span></label><input id="website2" class="hp" tabindex="-1" autocomplete="off"><div class="wide" id="error" role="alert"></div><button id="submit" class="ei-btn ei-btn--primary ei-btn--lg wide" type="submit">Submit</button></div></form></div><div id="done" class="ei-card success" hidden></div></main><script>const $=x=>document.getElementById(x),program=$('program'),type=$('type');function sync(){const nav=program.value==='NAVES';type.value=nav?'naves_application':'contact';type.disabled=nav;$('reviewRow').style.display=nav?'flex':'none';if(!nav)$('reviewConsent').checked=false}program.onchange=sync;sync();$('f').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;$('submit').textContent='Submitting…';const body={type:type.value,program:program.value,name:$('name').value,email:$('email').value,venture:$('venture').value,company:$('venture').value,industry:$('industry').value,stage:$('stage').value,need:$('need').value,city:$('city').value,province:$('province').value,website:$('website').value,describe:$('describe').value,looking:$('looking').value,answers:{problem:$('problem').value,goals:$('goals').value,hours:''},reviewConsent:$('reviewConsent').checked,directoryConsent:$('directoryConsent').checked,shareContact:$('shareContact').checked,website2:$('website2').value,source:'Founders website'};try{const r=await fetch('/api/registrations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error((d.errors||[d.error||'Submission failed']).join(' · '));$('formWrap').hidden=true;$('done').hidden=false;$('done').innerHTML='<span class="ei-eyebrow">Submission received</span><h1 class="ei-h1">Thank you, '+($('name').value||'founder')+'.</h1><p>Your permanent entrepreneur ID is <b>'+d.personId+'</b>.</p><p>Your submission ID is <b>'+d.submissionId+'</b>.</p><p class="ei-muted">Keep both IDs for future EmprendeIAE programs.</p><a class="ei-btn ei-btn--primary" href="/">Open Ecosystem Hub</a>'}catch(err){$('error').className='ei-alert ei-alert--danger';$('error').textContent=err.message;$('submit').disabled=false;$('submit').textContent='Submit'}}</script></body></html>
